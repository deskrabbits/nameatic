<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Full-bleed artwork: macOS 26 applies its own squircle mask. Any margins
       or pre-rounded corners here trigger the system's legacy-icon plate. -->
  <defs>
    <linearGradient id="base" x1="0.18" y1="0.02" x2="0.82" y2="0.98">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="0.6" stop-color="#0a5fd6"/>
      <stop offset="1" stop-color="#0a3f9c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="clip1g" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#d2e6ff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="clip2g" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b4d7ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="clip3g" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#96c8ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bubbleg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="pencilg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf4a"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="clipshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#04255c" flood-opacity="0.35"/>
    </filter>
    <filter id="bubbleshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="17" stdDeviation="20" flood-color="#04255c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- base fills the entire canvas -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#base)"/>

  <!-- stacked clip cards, back to front -->
  <g filter="url(#clipshadow)">
    <rect x="119.5" y="443.7" width="631.5" height="426.7" rx="77"
          transform="rotate(-14 435.2 657.1)" fill="url(#clip3g)"/>
  </g>
  <g filter="url(#clipshadow)">
    <rect x="196.3" y="324.3" width="631.5" height="426.7" rx="77"
          transform="rotate(-4 512 537.6)" fill="url(#clip2g)"/>
  </g>
  <g filter="url(#clipshadow)">
    <rect x="196.3" y="221.9" width="631.5" height="426.7" rx="77"
          transform="rotate(7 512 435.2)" fill="url(#clip1g)"/>
  </g>

  <!-- pencil badge bubble, bottom-right (kept clear of the system mask corner) -->
  <g filter="url(#bubbleshadow)">
    <rect x="660" y="660" width="280" height="280" rx="86" fill="url(#bubbleg)"/>
  </g>
  <g transform="rotate(-38 800 800)">
    <!-- eraser cap -->
    <rect x="677" y="771" width="34" height="58" rx="10" fill="#8a6a4a"/>
    <!-- body -->
    <rect x="711" y="771" width="181" height="58" rx="8" fill="url(#pencilg)"/>
    <!-- tip -->
    <path d="M 892 771 L 950 800 L 892 829 Z" fill="#d98a1f"/>
  </g>

  <!-- glass sheen across the top -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
</svg>
